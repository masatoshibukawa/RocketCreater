# Claude model configuration for rocketwright/agent/loop.py (CLAUDE.md section 8).
# API key is read by the SDK from the ANTHROPIC_API_KEY environment variable; never put it here.
allowed_tiers: [bottle]           # what this deployment designs; anything else is 「できません」
design_model: claude-haiku-5-5    # design decisions (extended thinking, adaptive)
light_model: claude-haiku-5-5     # light work: catalog summaries, reviewer fan-out (phase 3)
effort: low                       # output_config.effort for the design model: low|medium|high|xhigh|max
thinking_display: summarized      # thinking: {type: adaptive, display: ...}
max_tokens: 16000                 # per assistant turn (streaming)
max_attempts: 8                   # simulate_design calls per request
max_turns: 24                     # hard cap on API round trips (safety net; must exceed max_attempts)
reviewers:                        # phase-3 per-aspect reviewers (stability / recovery / cost / safety)
  enabled: true                   # review every passing candidate once, feed findings back
  model: claude-haiku-5-5         # structured-output call per aspect (messages.parse)
  effort: low                     # output_config.effort for the reviewers
  max_tokens: 4096
  max_rounds_per_candidate: 1     # a candidate (source_id) is reviewed at most this many times
