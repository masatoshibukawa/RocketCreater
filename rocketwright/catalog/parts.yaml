# RocketWright parts catalog, v2 format (see PARTS_SCHEMA.md and README.md in this directory).
#
# Rules (CLAUDE.md section 2, principle 4): every part carries a `source` URL or `provisional: true`
# with the estimate explained in `notes`. A part with a `source` may still be `provisional: true`
# when one of its numbers (usually mass or packed diameter) is derived rather than quoted.
#
# Prices: no Japanese retailer page listing these parts in JPY was found (searched 2026-11-03). Every
# `price_jpy` is the retailer's USD price converted at the fixed rate below and rounded; treat all
# prices as provisional until a JPY quotation replaces them.
#
# `items:` is a YAML alias of `parts:` so the v1 readers (`_load_yaml_list(..., "items")` in
# agent/tools.py and `_load_catalog_parts` in report.py) keep working; they only use id / tier /
# name / mass_kg / price_jpy / source / provisional. Readers of the v2 format should use `parts:`.
version: 2
price_jpy_basis: "USD x 150 JPY (fixed, provisional, 2026-11-03); converted retailer price per single unit"
parts: &parts
