    provisional: true
    notes: "ID .518 in / OD .544 in / 18 in (https://store.hobbyetc.com/parts/view/123059); OpenRocket Estes-legacy.orc EST 3084 ID 0.013081 OD 0.0137414 m. Mass computed (wall 0.33 mm, rho 849 kg/m3). Price: $11.29 per 4-pack -> per tube."
