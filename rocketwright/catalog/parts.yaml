  # ===================================================================================
  # BOTTLE TIER -- water rockets from carbonated-drink PET bottles
  # ===================================================================================
  # --- bottles -------------------------------------------------------------------------
  # Carbonated-drink bottles only: JAXA Space Education Center water-rocket manual (English, PDF):
  # "the PET bottles must be for carbonated drinks, as these can withstand greater pressure than
  # bottles used for non-carbonated drinks ... the air pressure should not exceed 7 atmospheres.
  # For the sake of safety, we recommend 4~5 atmospheres." -> max_gauge_pressure_pa = 500 kPa
  # (5 atm gauge, rounded down; 7 atm ~ 700 kPa is the hard limit). Neck: PCO 1881 is the 28 mm
  # carbonated finish (Wikipedia, PCO 1881); its bore ~22 mm is the 'full-bore' nozzle of water
  # rocketry (Wikipedia, Water rocket) -- 21.7 mm is the commonly quoted bore (provisional).
  # Masses: METI PET-bottle light-weighting criterion for pressure-resistant (carbonated) bottles,
  # mass_g = 0.0136 x volume_mL + 17.2 (search excerpt of the METI PDF; not opened) -> provisional.
  # Body diameter / length: typical values, Fischer et al. (arXiv:2001.08828) give bottle radius
  # 'about 4 to 5 cm'; provisional.
