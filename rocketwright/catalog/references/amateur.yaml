      dry_mass_kg: 0.241               # page: "Weight 8.5 oz (241 g)"
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 1.0}
    tolerance_frac: 0.60
    mass_tolerance_frac: 0.30
    notes: >-
      Parts from the product page (three BT-60 tubes, plastic nose, 4 laser-cut balsa fins, 24 in
      parachute, 24 mm D/E engines, 3/16 in rod). This kit is the evidence that a body longer
      than one stock tube is buildable (couplers), so build.check_buildability warns instead of
      erroring; coupler mass is not in the bill (no coupler part). Kit-level reproduction: dry
      mass 184 g vs 241 g (-24 %: couplers, the heavier kit nose and the long shock cord are
      missing from the parts), apogee 325 m vs 213 m (+53 %): with the lighter resolved mass the
      over-prediction of the geometric design (+24 % at 241 g) grows; a 2 m tube's skin friction
      is not captured by the frontal-area Cd 0.75. Tolerance 0.60 (was 0.30); the worst entry,
      kept as a known model limit. The sim also flags a slow rail exit on the 1.0 m rod
      (Estes sells this kit with the longer Porta-Pad E rod).
