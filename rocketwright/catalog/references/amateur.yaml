# Amateur-tier reference vehicles: Estes kits with the manufacturer's "projected max altitude",
# as KIT-LEVEL ground truth: every entry carries `build` (parts from catalog/parts.yaml and
# motors/*.eng) so the reproduction (references.reproduce) resolves the parts into the design,
# compares the bill's dry mass with the kit's published weight (`published.dry_mass_kg`,
# `mass_tolerance_frac`) and flies the RESOLVED design against the published altitude
# (`tolerance_frac`). Entries added in the first pass also keep their hand-written `design`
# (used only when `build` is absent); the newer entries state the kit once, as parts.
#
# Estes product pages give altitude, length, diameter, kit weight, parachute size and the
# recommended engines; they do NOT give fin dimensions or nose-cone length. Fin planforms are
# ESTIMATES (named in `notes`), nose lengths are the catalog part's (OpenRocket Estes database),
# so every entry is `provisional: true`. Parts without a catalog twin are mapped to the nearest
# part and said so: plastic fin units and card-stock fins -> balsa sheet; streamers -> the 12 in
# parachute (same mass class; affects the descent, not the apogee comparison).
#
# body_length_m = the kit's published length minus the catalog nose cone's exposed length.
# Kit weight: Estes "Weight"/"Estimated weight" is the built kit without engine (and, we
# assume, without wadding); our bill adds a 10 % glue/paint allowance (build.ALLOWANCES).
# Deploy delay: Estes "C6-5" means 5 s from burnout to ejection, roughly the coast to apogee;
# our model counts `deploy_delay_s` from APOGEE, so builds use 0 (= the grain that ejects at
# apogee; build.check_buildability always allows 0). The "max altitude" is taken to be the
# largest recommended engine's figure (C6 unless the page says otherwise); it is an Estes
# projection, not a measured flight.
# Env: calm sea-level site, 1.0 m launch rod (Estes Porta-Pad II rod is ~0.9 m).
version: 1
references:
  - id: estes_alpha_iii_c6
    tier: amateur
    name: "Estes Alpha III on C6-5"
    sources: ["https://estesrockets.com/products/alpha-iii"]
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 351
      payload_mass_kg: 0.0
      recovery_required: true
    design:                            # hand-written (geometric) fallback; `build` is flown
      tier: amateur
      body_diameter_m: 0.025           # page: 0.98 in (25 mm)
      body_length_m: 0.237             # page: length 12.1 in (30.7 cm) minus the nose estimate
      nose_shape: ogive
      nose_length_m: 0.070             # ESTIMATE: Estes PNC-50 style plastic nose ~2.75 in
      fins:                            # ESTIMATE: 3-fin moulded plastic unit, dims not published
        count: 3
        root_chord_m: 0.060
        tip_chord_m: 0.030
        span_m: 0.045
        sweep_m: 0.030
        thickness_m: 0.002
      motor_id: estes_C6
      dry_mass_kg: 0.034               # page: weight 1.2 oz (34 g), kit without motor
      payload_mass_kg: 0.0
      parachute_diameter_m: 0.305      # page: 12 in (30.5 cm) parachute
      deploy_delay_s: 0.5
    build:
      tier: amateur
      body_tube_id: estes_bt50_tube    # page: 0.98 in = BT-50
      body_length_m: 0.202             # 30.7 cm - 10.48 cm PNC-50 nose
      nose_cone_id: estes_pnc50_nose
      motor_mount_id: motor_mount_18mm # 18 mm engines (A8-C6), Estes regular mount in BT-50
      motor_id: estes_C6
      fin_material_id: fin_balsa_2p4mm # kit: one-piece moulded plastic fin unit -> nearest part (provisional)
      fins: {count: 3, root_chord_m: 0.060, tip_chord_m: 0.030, span_m: 0.045, sweep_m: 0.030}  # ESTIMATE
      parachute_id: estes_parachute_12in
      recovery_hardware_id: recovery_hardware_shock_cord_set
      launch_lug_id: launch_lug_3mm_rod # page: 1/8 in rod
      deploy_delay_s: 0.0
    published:
      apogee_m: 351                    # page: "Max altitude 1150 ft (351 m)"
      dry_mass_kg: 0.034               # page: "Weight 1.2 oz (34 g)" (kit, no engine)
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 1.0}
    tolerance_frac: 0.15
    mass_tolerance_frac: 0.15
    notes: >-
      Parts list from the product page (body tube, nose cone, one-piece plastic fin unit, 12 in
      parachute, 18 mm engines). Fin dimensions are ESTIMATES; the plastic fin unit is mapped to
      3/32 in balsa (provisional). The page lists eight recommended engines; 1150 ft is taken to
      be the C6-5 figure. Kit-level reproduction (resolved build): dry mass 31.1 g vs 34 g
      published (-8 %), apogee 351 m vs 351 m (-0.1 %) with solid.DEFAULT_CD = 0.75; both within
      0.15. The geometric design gave 346 m (-1.6 %).
