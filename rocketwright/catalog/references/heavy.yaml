# Heavy-tier reference vehicles (medium/heavy launchers, with strap-on boosters where fitted).
# See README.md for the format. Every number has a source URL in `sources`/`notes` or the
# entry is `provisional: true`. LEO capabilities are compared against a circular orbit at the
# altitude the source quotes; inclination is ignored by the 2-D model. Reproduction uses the
# coast-and-circularize insertion (see commercial.yaml); the simulated orbit altitude is the
# perigee after circularization.
version: 1
references:
  - id: falcon_9_ft
    tier: heavy
    name: "SpaceX Falcon 9 Full Thrust (expendable)"
    sources:
      - https://en.wikipedia.org/wiki/Falcon_9_Full_Thrust
      - https://en.wikipedia.org/wiki/SpaceX_Merlin
    provisional: true
    requirement:
      goal_kind: orbit
      target_altitude_m: 200000
      payload_mass_kg: 22800
    design:
      tier: heavy
      stages:
        - {propellant_mass_kg: 410900, structural_fraction: 0.0513, engine_id: merlin_1d, engine_count: 9}
        - {propellant_mass_kg: 107500, structural_fraction: 0.0359, engine_id: merlin_1d_vacuum, engine_count: 1}
      fairing_mass_kg: 1700
      payload_mass_kg: 22800
      pitch_start_s: 77.8
      initial_pitch_deg: 31.9
    published:
      payload_to_orbit_kg: 22800
      orbit_altitude_m: 200000
    env: {launch_latitude_deg: 28.5, launch_altitude_m: 5, earth_rotation: true}
    tolerance_frac: 0.15
    notes: >-
      Coast-and-circularize reproduction with earth_rotation ON (the 28.5 deg figure assumes an
      eastward launch from the Cape; with rotation off the open-loop turn ends at perigee
      -823 km): tuned kick about 78 s / 32 deg -> the second stage passes apogee during its burn,
      so the cutoff (at 321 km, descending) runs straight into the 400 m/s circularization ->
      200 x 322 km with 524 kg of propellant left; payload +3 %, orbit_altitude_m +0 %; tolerance
      0.15. The remaining +3 % is within the assumption that the 22,800 kg figure is for a 200 km
      orbit. Before the coast was modelled: perigee 205 km, payload -5 %.
      Wikipedia infobox: stage 1 empty 22,200 kg, LOX 287,400 + RP-1 123,500 = 410,900 kg
      propellant -> sf 22,200/433,100 = 0.0513; stage 2 empty 4,000 kg, LOX 75,200 + RP-1 32,300
      = 107,500 kg -> sf 4,000/111,500 = 0.0359; fairing 1,700 kg; liftoff 549,000 kg; 22,800 kg
      to LEO expended at 28.5 deg. The page gives no LEO altitude: 200 km is an ASSUMPTION
      (standard reference orbit). Launch site Cape Canaveral SLC-40.

  - id: atlas_v_551
    tier: heavy
    name: "ULA Atlas V 551 (5 x AJ-60A)"
    sources:
      - https://en.wikipedia.org/wiki/Atlas_V
    provisional: true
    requirement:
      goal_kind: orbit
      target_altitude_m: 200000
      payload_mass_kg: 18814
    design:
      tier: heavy
      stages:
        - {propellant_mass_kg: 284089, structural_fraction: 0.0690, engine_id: rd_180, engine_count: 1}
        - {propellant_mass_kg: 20830, structural_fraction: 0.1001, engine_id: rl10, engine_count: 1}
      boosters:
        - {booster_id: aj_60a, count: 5}
      fairing_mass_kg: 4000
      payload_mass_kg: 18814
      pitch_start_s: 5.0
      initial_pitch_deg: 1.9
    published:
      payload_to_orbit_kg: 18814
      orbit_altitude_m: 200000
    env: {launch_latitude_deg: 28.5, launch_altitude_m: 5, earth_rotation: true}
    tolerance_frac: 0.3
    notes: >-
      Coast-and-circularize reproduction with earth_rotation ON (28.5 deg eastward launch; with
      rotation off the turn ends at perigee -6,370 km): tuned kick about 5 s / 1.9 deg -> the
      Centaur (T/W 0.44) passes apogee during its burn, so the cutoff (at 574 km, descending) runs
      straight into a 415 m/s circularization -> 200 x 679 km with 3,340 kg of propellant left;
      payload +26 %, orbit_altitude_m -0 %; tolerance 0.30. The remaining +26 % is attributed to
      the 2-D model crediting the whole burn as in-plane while the real 551 LEO figure is limited
      by the fairing/adapter and flies a lofted, guided Centaur trajectory; the estimated 4,000 kg
      fairing and the RL10C-1 catalog entry standing in for the RL10A-4-2 also enter. Before the
      coast was modelled: perigee 234 km, apogee 1,300 km, payload -27 %.
      Core and Centaur as atlas_v_401. Five AJ-60A boosters (gross 46,697 kg, propellant 42,630
      kg, 279.3 s, 94 s burn, infobox). 18,814 kg to LEO at 28.5 deg (versions table; 200 km is
      an ASSUMPTION). Fairing 4,000 kg is an ESTIMATE (5 m fairing, not on the page). Boosters
      are modelled with a constant mean thrust and jettisoned together.

