# NOT INCLUDED (reproduction error exceeds the 0.6 cap; data kept here for a human to check):
# JAXA H3 (https://en.wikipedia.org/wiki/H3_(rocket), https://en.wikipedia.org/wiki/SRB-3).
#   Stage 1: gross 241 t, propellant 226 t -> sf 15/241 = 0.0622, le_9 x 3 (H3-30) or x 2 (H3-24).
#   Stage 2: gross 28 t, propellant 24.6 t -> sf 3.4/28 = 0.1214, le_5b_3 x 1.
#   Boosters: srb_3 x 4 (H3-24). Fairing not on the page (1,400 kg estimate).
#   Published: H3-30 4,000 kg to 500 km SSO (liftoff 271 t); H3-24 16,000 kg to 420 km LEO
#   (liftoff 575 t). Our model gives +85 % (H3-30, tuner burns out at 2,700 km) and +90 %
#   (H3-24): the implied 6.2 % first-stage structural fraction for a 226 t LH2 stage with 2-3
#   LE-9 (2.4 t each) is far lighter than Ariane 5 EPC (7.8 %) or Delta IV CBC (11.7 %), so the
#   Wikipedia stage masses are suspect. The le_9, le_5b_3 and srb_3 catalog entries stay.
