# Bottle-tier reference vehicles (water rockets) with a published, measured apogee, as KIT-LEVEL
# ground truth: every entry carries `build` (bottle, nozzle, fin set, launcher from
# catalog/parts.yaml); references.reproduce resolves it (dry mass = the bill), compares the mass
# with `published.dry_mass_kg` where the paper gives one, and flies the resolved design.
# Format: see README.md in this directory. Every number either comes from the cited source or is
# an estimate named in `notes` (then the entry stays `provisional: true`).
#
# Source A: Apte & Apte, "The influence of different factors on the maximum height reached of a
#   water powered rocket", Journal of High School Science (2 L soda bottle, 3 plastic fins, nose
#   cone cut from a second 2 L bottle, nozzle area 3.878e-4 m2 = 22.2 mm bore, launched from a
#   PVC launch-tube pad pressurised with a bicycle pump with gauge). Flight time measured by
#   stopwatch; the paper converts it to height with h = (g t/2)^2 / (2 g) = g t^2 / 8 (Table 4).
#   Water volume 350/800/1250 mL, 20/30/40 psig. The empty-rocket mass is NOT stated in the
#   paper: the catalog part `bottle_fin_set_apte_2l` closes the 0.10 kg ESTIMATE.
# Source B: Fischer et al., "On the approximation of D.I.Y. water rocket dynamics including air
#   drag", arXiv:2001.08828 (1000 mL bottle, radius 40 mm, empty mass 143 g, nozzle 9 mm,
#   wind-tunnel Cd 0.6 +/- 0.2; altitude read from video against a measuring rod, +/- 0.5 m;
#   p0 in the paper is ABSOLUTE pressure, gauge = p0 - 1 bar; launches 1-4 at 17 C). The catalog
#   part `bottle_fin_set_fischer_1l` (fins + nose + ballast) closes the published 143 g.
#
# No further independent water-rocket source with BOTH a measured apogee and a parts list was
# found (2026-11-03): JAXA / APRSAF and the Japanese school reports score landing distance, the
# NHSJS 2025 1 L study measures range, the WRA2 single-bottle records exceed the catalog's
# 500 kPa bottle cap and publish no parts. The added entries are further flights of the two
# documented rockets.
version: 1
references:
  - id: apte_2l_800ml_30psi
    tier: bottle
    name: "Apte & Apte 2 L soda-bottle rocket, 800 mL water, 30 psig"
    sources:
      - "https://jhss.scholasticahq.com/api/v1/articles/2101-the-influence-of-different-factors-on-the-maximum-height-reached-of-a-water-powered-rocket.pdf"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 19.0
      payload_mass_kg: 0.0
    design:                            # hand-written fallback; `build` is flown
      tier: bottle
      bottle_volume_m3: 0.002
      water_fill_frac: 0.40            # 800 mL of 2000 mL (Table 2: medium)
      initial_gauge_pressure_pa: 206843  # 30 psig (Table 2: medium)
      nozzle_diameter_m: 0.0222        # Table 1: nozzle area 3.878e-4 m2
      dry_mass_kg: 0.10                # ESTIMATE: not in the paper (see notes)
      has_fins: true
      has_parachute: false
    build:
      tier: bottle
      bottle_id: pet_bottle_2l         # 2 L carbonated soda bottle (Table 1: 111 mm x 330 mm body)
      water_fill_frac: 0.40
      initial_gauge_pressure_pa: 206843
      nozzle_id: bottle_nozzle_full_bore_22mm  # open neck, 21.7 mm vs the paper's 22.2 mm bore
      fin_set_id: bottle_fin_set_apte_2l       # the paper's 3 fins + bottle-top nose (provisional)
      launcher_id: launcher_bicycle_pump       # paper: bicycle pump with gauge, 2 ft PVC pad
    published:
      apogee_m: 19.02                  # Table 4, experiment 5 (flight time 3.94 s -> g t^2 / 8)
      flight_time_s: 3.94
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.6}
    tolerance_frac: 0.15
    notes: >-
      Apogee is the paper's own conversion of the stopwatch flight time (3.94 s) with
      h = g t^2 / 8, i.e. ballistic up-and-down with no drag; a drag-affected real apogee would be
      a little lower, so the published value is an upper-ish bound. The rocket's mass is not in
      the paper: bill = 44 g bottle + 5 g neck seal + 51 g fin/nose set = 0.100 kg (ESTIMATE),
      so no dry_mass_kg is published for the Apte entries. The launcher is a PVC launch tube
      inside the bottle (the model has no launch-tube thrust; rail_length_m 0.6 = the 2 ft PVC
      pad). With the calibrated water.DEFAULT_CD = 0.8 (the paper's own assumption) and
      AIR_IMPULSE_EFFICIENCY = 0.25 (scripts/calibrate_small_rockets.py) the resolved build gives
      20.7 m (+8.8 %); tolerance 0.15. Remaining attribution: the dry-mass ESTIMATE and the
      stopwatch-derived apogee (+/-0.3 s ~ +/-15 %).
