# Bottle-tier reference vehicles (water rockets) with a published, measured apogee.
# Format: see README.md in this directory. Every number either comes from the cited source or is
# an estimate named in `notes` (then the entry stays `provisional: true`).
#
# Source A: Apte & Apte, "The influence of different factors on the maximum height reached of a
#   water powered rocket", Journal of High School Science (2 L soda bottle, 3 plastic fins, nose
#   cone cut from a second 2 L bottle, nozzle area 3.878e-4 m2 = 22.2 mm bore, launched from a
#   PVC launch-tube pad). Flight time measured by stopwatch; the paper converts it to height with
#   h = (g t/2)^2 / (2 g) = g t^2 / 8 (Table 4). Water volume 350/800/1250 mL, 20/30/40 psig.
#   The empty-rocket mass is NOT stated in the paper (estimated below).
# Source B: Fischer et al., "On the approximation of D.I.Y. water rocket dynamics including air
#   drag", arXiv:2001.08828 (1000 mL bottle, radius 40 mm, empty mass 143 g, nozzle 9 mm,
#   wind-tunnel Cd 0.6 +/- 0.2; altitude read from video against a measuring rod, +/- 0.5 m;
#   p0 in the paper is ABSOLUTE pressure, gauge = p0 - 1 bar; launches 1-4 at 17 C).
version: 1
references:
  - id: apte_2l_800ml_30psi
    tier: bottle
    name: "Apte & Apte 2 L soda-bottle rocket, 800 mL water, 30 psig"
    sources:
      - "https://jhss.scholasticahq.com/api/v1/articles/2101-the-influence-of-different-factors-on-the-maximum-height-reached-of-a-water-powered-rocket.pdf"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 19.0
      payload_mass_kg: 0.0
    design:
      tier: bottle
      bottle_volume_m3: 0.002
      water_fill_frac: 0.40            # 800 mL of 2000 mL (Table 2: medium)
      initial_gauge_pressure_pa: 206843  # 30 psig (Table 2: medium)
      nozzle_diameter_m: 0.0222        # Table 1: nozzle area 3.878e-4 m2
      dry_mass_kg: 0.10                # ESTIMATE: not in the paper (see notes)
      has_fins: true
      has_parachute: false
    published:
      apogee_m: 19.02                  # Table 4, experiment 5 (flight time 3.94 s -> g t^2 / 8)
      flight_time_s: 3.94
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.6}
    tolerance_frac: 0.15
    notes: >-
      Apogee is the paper's own conversion of the stopwatch flight time (3.94 s) with
      h = g t^2 / 8, i.e. ballistic up-and-down with no drag; a drag-affected real apogee would be
      a little lower, so the published value is an upper-ish bound. dry_mass_kg 0.10 is an
      ESTIMATE (2 L PET bottle ~50 g + 3 plastic-folder fins + nose cone cut from a second 2 L
      bottle + hot glue); the paper gives no mass. The launcher is a PVC launch tube inside the
      bottle (the model has no launch-tube thrust; rail_length_m 0.6 = the 2 ft PVC pad).
      With the calibrated water.DEFAULT_CD = 0.8 (the paper's own assumption) and
      AIR_IMPULSE_EFFICIENCY = 0.25 (scripts/calibrate_small_rockets.py) our model gives 20.7 m
      (+8.7 %, was +43 % at Cd 0.5 / 0.5); tolerance tightened from 0.50 to 0.15. Remaining
      attribution: the dry-mass ESTIMATE and the stopwatch-derived apogee (+/-0.3 s ~ +/-15 %).
  - id: apte_2l_800ml_40psi
    tier: bottle
    name: "Apte & Apte 2 L soda-bottle rocket, 800 mL water, 40 psig"
    sources:
      - "https://jhss.scholasticahq.com/api/v1/articles/2101-the-influence-of-different-factors-on-the-maximum-height-reached-of-a-water-powered-rocket.pdf"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 22.0
      payload_mass_kg: 0.0
    design:
      tier: bottle
      bottle_volume_m3: 0.002
      water_fill_frac: 0.40            # 800 mL (medium)
      initial_gauge_pressure_pa: 275790  # 40 psig (high)
      nozzle_diameter_m: 0.0222
      dry_mass_kg: 0.10                # ESTIMATE (see apte_2l_800ml_30psi)
      has_fins: true
      has_parachute: false
    published:
      apogee_m: 22.02                  # Table 4, experiment 6 (flight time 4.24 s)
      flight_time_s: 4.24
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.6}
    tolerance_frac: 0.30
    notes: >-
      Same rocket and caveats as apte_2l_800ml_30psi; the highest flight of the paper's 3x3
      design of experiments. Apogee derived from flight time by the authors (g t^2 / 8).
      With the calibrated Cd 0.8 / AIR_IMPULSE_EFFICIENCY 0.25 our model gives 25.6 m (+16.4 %,
      was +59 %); tolerance tightened from 0.60 to 0.30. Remaining attribution: the 0.10 kg
      dry-mass ESTIMATE (0.20 kg would give +9 %) and the stopwatch-derived apogee; the model
      over-predicts more at the higher pressure, which also points at the air-blowdown model.
  - id: apte_2l_350ml_40psi
    tier: bottle
    name: "Apte & Apte 2 L soda-bottle rocket, 350 mL water, 40 psig"
    sources:
      - "https://jhss.scholasticahq.com/api/v1/articles/2101-the-influence-of-different-factors-on-the-maximum-height-reached-of-a-water-powered-rocket.pdf"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 18.0
      payload_mass_kg: 0.0
    design:
      tier: bottle
      bottle_volume_m3: 0.002
      water_fill_frac: 0.175           # 350 mL (low)
      initial_gauge_pressure_pa: 275790  # 40 psig (high)
      nozzle_diameter_m: 0.0222
      dry_mass_kg: 0.10                # ESTIMATE (see apte_2l_800ml_30psi)
      has_fins: true
      has_parachute: false
    published:
      apogee_m: 18.44                  # Table 4, experiment 3 (flight time 3.88 s)
      flight_time_s: 3.88
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.6}
    tolerance_frac: 0.45
    notes: >-
      Same rocket and caveats as apte_2l_800ml_30psi; low-water case, where the residual air
      blowdown carries more of the impulse. Apogee derived from flight time by the authors.
      With the calibrated Cd 0.8 / AIR_IMPULSE_EFFICIENCY 0.25 our model gives 24.6 m (+33.4 %,
      was +96 % at Cd 0.5 / 0.5); tolerance lowered from 1.0 to 0.45, still the worst entry.
      With only 350 mL of water the air left at 33 psig when the water runs out (paper, Table 4)
      carries much of the impulse, so the one-impulse air-blowdown model is the prime suspect
      (AIR_IMPULSE_EFFICIENCY 0.0 would give +12.8 %, but that leaves the Fischer flights 15-26 %
      low); the 0.10 kg dry-mass ESTIMATE is the other (0.20 kg would give +7 %). Confirm the
      rocket's mass or replace the air phase with a time-resolved blowdown before tightening.
  - id: fischer_1l_350ml_2p5bar
    tier: bottle
    name: "Fischer et al. 1 L D.I.Y. rocket, 350 mL water, 2.5 bar gauge"
    sources:
      - "https://arxiv.org/abs/2001.08828"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 17.5
      payload_mass_kg: 0.0
    design:
      tier: bottle
      bottle_volume_m3: 0.001          # Section 9: bottle volume 1000 mL, radius 40 mm
      water_fill_frac: 0.35            # Table 2, launch 1: Vl = 350 +/- 10 mL
      initial_gauge_pressure_pa: 250000  # p0 = 3.5 bar absolute, pa ~ 1 bar -> 2.5 bar gauge
      nozzle_diameter_m: 0.009         # Section 2.1: "Our nozzle has a diameter of about 9 mm"
      dry_mass_kg: 0.143               # Section 9: "has weight 143 g"
      has_fins: true
      has_parachute: false
    published:
      apogee_m: 17.5                   # Table 2, launch 1: h_mes = 17.5 +/- 0.5 m (video vs rod)
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.5}
    tolerance_frac: 0.15
    notes: >-
      All design numbers are stated in the paper; only the launcher length (0.5 m) is an
      ESTIMATE (an indoor "launching device", length not given). The paper's own model with
      Cd = 0.6 (wind-tunnel value) and an air-thrust efficiency factor reproduces 17.2 m.
      "Fins" is assumed: the wind-tunnel photo shows a finned, nose-first rocket. Has fins per the
      paper's streamlined D.I.Y. rocket; gauge pressure = p0 - 1 bar (the paper quotes absolute).
      With the calibrated Cd 0.8 / AIR_IMPULSE_EFFICIENCY 0.25 our model gives 16.2 m (-7.5 %;
      +9 % at the old 0.5 / 0.5); tolerance tightened from 0.30 to 0.15. The fleet Cd 0.8 is
      above this streamlined rocket's measured 0.6, which is why it now under-predicts.
  - id: fischer_1l_255ml_2bar
    tier: bottle
    name: "Fischer et al. 1 L D.I.Y. rocket, 255 mL water, 2.0 bar gauge"
    sources:
      - "https://arxiv.org/abs/2001.08828"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 14.0
      payload_mass_kg: 0.0
    design:
      tier: bottle
      bottle_volume_m3: 0.001
      water_fill_frac: 0.255           # Table 2, launch 3: Vl = 255 +/- 10 mL
      initial_gauge_pressure_pa: 200000  # p0 = 3.0 bar absolute -> 2.0 bar gauge
      nozzle_diameter_m: 0.009
      dry_mass_kg: 0.143
      has_fins: true
      has_parachute: false
    published:
      apogee_m: 14.1                   # Table 2, launch 3: h_mes = 14.1 +/- 0.5 m
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.5}
    tolerance_frac: 0.30
    notes: >-
      Same rocket as fischer_1l_350ml_2p5bar (the paper's own prediction: 13.3 m; the conclusion
      says the measured lower bound was 13.6 m). Launcher length 0.5 m is an ESTIMATE.
      With the calibrated Cd 0.8 / AIR_IMPULSE_EFFICIENCY 0.25 our model gives 11.8 m (-16.6 %;
      -0.5 % at the old 0.5 / 0.5), so the tolerance stays 0.30. Remaining attribution: the
      fleet Cd 0.8 is above this rocket's wind-tunnel 0.6, and with less water (255 mL) the
      halved air impulse matters more; with its own Cd 0.6 and air 0.5 the model gives -2.7 %.
      A per-design Cd (BottleDesign has none) would reconcile the Apte and Fischer rockets.
