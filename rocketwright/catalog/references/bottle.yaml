      nozzle_id: bottle_nozzle_full_bore_22mm
      fin_set_id: bottle_fin_set_apte_2l
      launcher_id: launcher_bicycle_pump
    published:
      apogee_m: 18.44                  # Table 4, experiment 3 (flight time 3.88 s)
      flight_time_s: 3.88
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.6}
    tolerance_frac: 0.45
    notes: >-
      Same rocket and caveats as apte_2l_800ml_30psi; low-water case, where the residual air
      blowdown carries more of the impulse. Apogee derived from flight time by the authors.
      The resolved build gives 24.6 m (+33.4 %); tolerance 0.45. With only 350 mL of water the
      air left at 33 psig when the water runs out (paper, Table 4) carries much of the impulse,
      so the one-impulse air-blowdown model is the prime suspect (AIR_IMPULSE_EFFICIENCY 0.0
      would give +12.8 %, but that leaves the Fischer flights 15-26 % low); the 0.10 kg dry-mass
      ESTIMATE is the other (0.20 kg would give +7 %). Confirm the rocket's mass or replace the
      air phase with a time-resolved blowdown before tightening.
