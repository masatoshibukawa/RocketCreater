      heavy residual water is dead mass; the paper's rocket evidently expelled more of it.
      build.check_buildability warns that 62 % is outside the usual 20-60 % fill range.
  - id: fischer_1l_350ml_2p5bar
    tier: bottle
    name: "Fischer et al. 1 L D.I.Y. rocket, 350 mL water, 2.5 bar gauge"
    sources:
      - "https://arxiv.org/abs/2001.08828"
    provisional: true
    requirement:
      goal_kind: altitude
      target_altitude_m: 17.5
      payload_mass_kg: 0.0
    design:                            # hand-written fallback; `build` is flown
      tier: bottle
      bottle_volume_m3: 0.001          # Section 9: bottle volume 1000 mL, radius 40 mm
      water_fill_frac: 0.35            # Table 2, launch 1: Vl = 350 +/- 10 mL
      initial_gauge_pressure_pa: 250000  # p0 = 3.5 bar absolute, pa ~ 1 bar -> 2.5 bar gauge
      nozzle_diameter_m: 0.009         # Section 2.1: "Our nozzle has a diameter of about 9 mm"
      dry_mass_kg: 0.143               # Section 9: "has weight 143 g"
      has_fins: true
      has_parachute: false
    build:
      tier: bottle
      bottle_id: pet_bottle_1l         # 1000 mL bottle, radius 40 mm
      water_fill_frac: 0.35
      initial_gauge_pressure_pa: 250000
      nozzle_id: bottle_nozzle_gardena_9mm     # "about 9 mm" (Gardena-type)
      fin_set_id: bottle_fin_set_fischer_1l    # the paper's fins + nose + ballast (provisional)
      launcher_id: null                # indoor "launching device", not described
    published:
      apogee_m: 17.5                   # Table 2, launch 1: h_mes = 17.5 +/- 0.5 m (video vs rod)
      dry_mass_kg: 0.143               # Section 9: "has weight 143 g" (empty rocket)
    env: {launch_latitude_deg: 0.0, launch_altitude_m: 0.0, wind_speed_mps: 0.0, rail_length_m: 0.5}
    tolerance_frac: 0.15
    mass_tolerance_frac: 0.15
    notes: >-
      All design numbers are stated in the paper; only the launcher length (0.5 m) is an
      ESTIMATE (an indoor "launching device", length not given). The paper's own model with
      Cd = 0.6 (wind-tunnel value) and an air-thrust efficiency factor reproduces 17.2 m.
      "Fins" is assumed: the wind-tunnel photo shows a finned, nose-first rocket. Gauge pressure
      = p0 - 1 bar (the paper quotes absolute). The resolved build weighs 143 g by construction
      (the fin/nose set closes the published mass: 0 % error, a consistency check rather than a
      prediction); apogee 16.2 m (-7.5 %); tolerance 0.15. The fleet Cd 0.8 is above this
      streamlined rocket's measured 0.6, which is why it under-predicts.
