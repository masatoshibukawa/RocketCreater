<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CFD進捗 · {{CASE}}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f6;color:#173744;font:16px/1.5 system-ui,sans-serif}
main{max-width:1050px;margin:0 auto;padding:clamp(16px,4vw,44px)}
header{display:flex;align-items:baseline;gap:1em;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,34px);margin:.1em 0}
small{color:#42606d;overflow-wrap:anywhere}progress{width:100%;height:8px;accent-color:#19778a;margin:14px 0 10px}
figure{margin:10px 0;background:white;border:1px solid #bacdd1;border-radius:10px;overflow:hidden}
img{display:block;width:100%;height:auto}figcaption,.waiting{padding:12px 16px}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px}nav a{color:#125669;border:1px solid #789aa1;padding:7px 14px;border-radius:6px;text-decoration:none}
nav a[aria-current=true]{background:#125669;color:white}a:focus-visible{outline:3px solid #d67e18;outline-offset:2px}
</style>
<main><header><h1>機体まわりの流れ</h1><small>{{CASE}}</small></header>
<div>{{STATUS}} · {{PERCENT}}%</div><progress value="{{PERCENT}}" max="100">{{PERCENT}}%</progress>
<figure>{{IMAGE}}<figcaption id="caption">青は流れ方向の速度が主流の80%になる面です。下段は中央付近の速度断面と、この時点までの抗力履歴です。</figcaption></figure>
<nav aria-label="表示する計算時点">{{BUTTONS}}</nav>{{GRIDS}}</main>
<script>
const links = Array.from(document.querySelectorAll('[data-percent]'));
const latest = links.at(-1);
function select(frame) {
  if (!frame) return;
  document.getElementById('frame').src = frame.href;
  document.getElementById('full').href = frame.href;
  document.getElementById('frame').alt = frame.textContent + '時点の後流・速度断面・抗力履歴';
  links.forEach(a => a.setAttribute('aria-current', String(a === frame)));
}
function fromHash() {
  select(links.find(a => '#' + a.dataset.percent === location.hash) || latest);
}
links.forEach(a => a.addEventListener('click', event => {
  event.preventDefault();
  location.hash = a === latest ? '' : a.dataset.percent;
  fromHash();
}));
addEventListener('hashchange', fromHash); fromHash();
if ({{LIVE}}) setInterval(() => {
  if (!location.hash && !document.hidden) location.reload();
}, 3000);
</script></html>
