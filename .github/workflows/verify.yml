name: Verify application
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest httpx ruff
      - run: python -m pytest tests/test_design_projects.py tests/test_production_geometry.py tests/test_openfoam_host.py tests/test_adaptive.py tests/test_report.py
        env:
          ROCKETWRIGHT_ENABLE_CLOUD_DESIGN: '0'
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec tsc --noEmit && pnpm build
        working-directory: web
      - run: node --test web/tests/*.test.mjs
