[project]
name = "rocketwright"
version = "0.1.0"
description = "Tiered rocket design, simulation and verification backend driven by Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=1,<2",
    "reportlab>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocketwright", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rocketwright", "api"]
